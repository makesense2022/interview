<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electron 最小示例</title>
    <style>
      html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto}
      main{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
      button{padding:8px 14px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer}
      .muted{color:#666;font-size:12px}
    </style>
  </head>
  <body>
    <main>
      <h1>Electron Demo</h1>
      <p class="muted">主进程 ↔ 预加载桥接 ↔ 渲染进程</p>
      <button id="btn">Ping 主进程</button>
      <pre id="out">点击上面的按钮</pre>
    </main>
    <script>
      const btn = document.getElementById('btn')
      const out = document.getElementById('out')
      btn.addEventListener('click', async () => {
        try {
          const res = await window.api.ping()
          out.textContent = `收到：${res}`
        } catch (e) {
          out.textContent = `错误：${e?.message || e}`
        }
      })
    </script>
  </body>
</html>
